name: JiggleJam
options:
  bundleIdPrefix: com.jigglejam
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JiggleJam:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Sample game packs shipped with the app; installed into the library on first launch.
      - path: Packs
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Jiggle Jam
        LSApplicationCategoryType: public.app-category.kids-games
        NSCameraUsageDescription: Jiggle Jam uses the camera to see your moves so you can play games with your body.
        NSCameraUseContinuityCameraDeviceType: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Jiggle Jam Game
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.jigglejam.game]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jigglejam.game
            UTTypeDescription: Jiggle Jam Game
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [jigglegame]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jigglejam.app
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
  JiggleJamTests:
    type: bundle.unit-test
    platform: macOS
    # Pure logic only (no app host): pose types, motion detectors, game-pack format and script host.
    sources:
      - path: Tests
      - path: Sources/Platform/PoseTypes.swift
      - path: Sources/Platform/MotionDetectors.swift
      - path: Sources/Games/WordTrainWords.swift
      - path: Sources/Platform/Packs/GamePack.swift
      - path: Sources/Platform/Packs/ScriptHost.swift
      - path: Sources/Platform/Packs/ScriptRunner.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jigglejam.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JiggleJam:
    build:
      targets:
        JiggleJam: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [JiggleJamTests]
